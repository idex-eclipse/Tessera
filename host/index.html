<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessera</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Внешние скрипты, не inline: nginx из install.sh отдаёт CSP script-src 'self' -->
    <script src="/boot-theme.js"></script>
    <style>
      /* Собственные переменные стартового экрана: global.css на этот момент может быть не загружен.
         Значения совпадают с --bg-app / --text-primary / --text-secondary / --accent темы. */
      :root { color-scheme: light; --boot-bg: #f0f2f5; --boot-fg: #1a1a1a; --boot-muted: #5f6368; --boot-accent: #4285f4; }
      :root[data-theme='dark'] { color-scheme: dark; --boot-bg: #121212; --boot-fg: #e0e0e0; --boot-muted: #9aa0a6; --boot-accent: #669df6; }
      html { background: var(--boot-bg); }
      .boot {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; padding: 0 16px; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--boot-bg); color: var(--boot-fg);
      }
      /* 80% меньшей стороны окна, но так, чтобы вместе с подписью всё помещалось по высоте */
      .boot-cube {
        --size: max(96px, min(80vw, calc(80vh - 7rem)));
        width: var(--size); height: var(--size); flex-shrink: 0;
        overflow: visible; color: var(--accent, var(--boot-accent));
      }
      .boot-cube line {
        stroke: currentColor; stroke-linecap: round;
        vector-effect: non-scaling-stroke; stroke-width: clamp(2px, 0.5vmin, 5px);
      }
      .boot-title { font-weight: 700; font-size: clamp(1.5rem, 5vmin, 2.5rem); letter-spacing: 0.3em; text-indent: 0.3em; }
      .boot-tagline { margin-top: -0.75rem; font-size: clamp(0.9rem, 2.4vmin, 1.2rem); color: var(--boot-muted); }
      /* Уход экрана: main.ts вешает класс, когда приложение уже смонтировано под ним.
         Длительность 1.1s должна быть меньше страховочного таймера в main.ts (dismissBoot). */
      .boot-leaving { opacity: 0; pointer-events: none; transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1); }
      .boot-leaving .boot-cube { transform: scale(1.2); transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1); }
      .boot-leaving .boot-title, .boot-leaving .boot-tagline { transform: translateY(8px); transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Стартовый экран: лежит поверх приложения, пока main.ts не смонтирует App и не уберёт его плавно -->
      <div class="boot" role="status" aria-label="Tessera">
        <svg class="boot-cube" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
        <div class="boot-title">TESSERA</div>
        <div class="boot-tagline">Modular UI for modular printers</div>
      </div>
    </div>
    <script src="/boot-cube.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
